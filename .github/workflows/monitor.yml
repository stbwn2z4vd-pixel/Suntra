name: Stock Monitor

on:
  schedule:
    # 21:30 UTC, mån-fre = efter både Stockholmsbörsens och
    # amerikanska börsens stängning (oavsett sommar-/vintertid).
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}   # gör att du kan köra manuellt från GitHub-fliken "Actions"

permissions:
  contents: write   # behövs för att skriptet ska kunna committa state.json

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installera beroenden
        run: pip install -r requirements.txt

      - name: Kör aktieanalys
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Valfri: ger AI-skriven förklaringstext istället för bara mallen.
          # Lämna secreten otillagd/tom om du inte vill använda den.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py

      - name: Spara uppdaterat state.json
        run: |
          git config user.name "stock-monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Uppdatera signalstatus [skip ci]"
          git push
